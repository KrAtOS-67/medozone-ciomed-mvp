server:
  port: 8080

spring:
  application:
    name: medozone-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medozone}
    username: ${DB_USER:medozone_app}
    password: ${DB_PASSWORD:medozone_local_change_me}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/La_Paz
  mail:
    host: smtp.tu-proveedor.com
    port: 587
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  mail:
      enabled: True          
      from: ${APP_MAIL_FROM:no-reply@ciomed.bo}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:240}
  spring:
    mail:
      default-encoding: UTF-8
  logging:
  level:
    root: INFO
    bo.ciomed.medozone: INFO
    org.springframework.security: WARN